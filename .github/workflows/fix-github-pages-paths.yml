name: Fix GitHub Pages paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize site base URL
        shell: bash
        run: |
          set -e
          BASE='https://gpldroid.github.io/dev-v3/'

          find . -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.webmanifest' -o -name '*.json' -o -name '*.js' -o -name '*.css' -o -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' \
            -print0 | xargs -0 -r sed -i \
              -e "s#https://larache\\.xyz/#$BASE#g" \
              -e "s#https://gpldroid\\.github\\.io/dev-v2/#$BASE#g" \
              -e "s#https://gpldroid\\.github\\.io/dev-v3//#$BASE#g" \
              -e "s#https://gpldroid\\.github\\.io/dev-v3/#$BASE#g" \
              -e "s#href=\"/favicon\\.svg\"#href=\"$BASE/favicon.svg\"#g" \
              -e "s#src=\"/favicon\\.svg\"#src=\"$BASE/favicon.svg\"#g" \
              -e "s#href=\"/manifest\\.webmanifest\"#href=\"$BASE/manifest.webmanifest\"#g" \
              -e "s#href=\"/assets/#href=\"$BASE/assets/#g" \
              -e "s#src=\"/assets/#src=\"$BASE/assets/#g" \
              -e "s#href=\"/privacy\\.html\"#href=\"$BASE/privacy.html\"#g" \
              -e "s#href=\"/terms\\.html\"#href=\"$BASE/terms.html\"#g" \
              -e "s#href=\"/instructions\\.html\"#href=\"$BASE/instructions.html\"#g" \
              -e "s#href=\"/platforms\\.html\"#href=\"$BASE/platforms.html\"#g" \
              -e "s#href=\"/sitemap\\.html\"#href=\"$BASE/sitemap.html\"#g" \
              -e "s#href=\"/\"#href=\"$BASE\"#g" \
              -e "s#src=\"/\([^\"]*\)\"#src=\"$BASE/\1\"#g"

          if [ -f sitemap.xml ]; then
            sed -i -E "s#https://larache\\.xyz/#$BASE#g; s#https://gpldroid\\.github\\.io/dev-v2/#$BASE#g; s#https://gpldroid\\.github\\.io/dev-v3//#$BASE#g; s#https://gpldroid\\.github\\.io/dev-v3/#$BASE#g" sitemap.xml
          fi

          git diff --check

      - name: Commit normalized paths
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No path changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix GitHub Pages base paths for dev-v3'
          git push
